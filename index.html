<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOLAR – Space strategy in our Solar System</title>
<meta name="description" content="SOLAR: turn-based 4X space strategy in our own Solar System. Terrans, Martians, Jovians and Belters race for the planets. / Stratégie spatiale 4X au tour par tour dans notre système solaire.">
<meta name="theme-color" content="#070718">
<link rel="icon" href="assets/pwa/icon-192.png">
<link rel="apple-touch-icon" href="assets/pwa/icon-192.png">
<meta property="og:title" content="SOLAR">
<meta property="og:description" content="Turn-based 4X space strategy in our own Solar System.">
<meta property="og:image" content="https://solar-game.com/assets/fond_accueil_desk.jpg">
<!-- PAGE D'ACCUEIL PUBLIQUE (13/10/2026, maquette validée par Marc). Le jeu est dans play.html (mot de passe
     des testeurs, voir acces.js). Cette page n'utilise aucun script du jeu.
     FILM : quand les vidéos sont sur YouTube, mettre leurs identifiants dans FILM, en bas (ex. 'dQw4w9WgXcQ'
     pour https://www.youtube.com/watch?v=dQw4w9WgXcQ). Vide = vignette « bientôt ». -->
<style>
@font-face{font-family:'Michroma';src:url(assets/fonts/Michroma.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Exo 2';src:url(assets/fonts/Exo2.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{
  --nuit:#070718;--verre:rgba(10,14,36,.78);--verre-bord:rgba(110,150,230,.28);
  --texte:#e6ebf7;--doux:#a3afcc;--bleu:#3d7bdc;--bleu-clair:#8fb4f2;--soleil:#f2a24a;
  --titre:'Michroma','Eurostile',sans-serif;--corps:'Exo 2','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--nuit)}
body{margin:0;color:var(--texte);font:400 17px/1.6 var(--corps);padding-top:env(safe-area-inset-top,0px)}
.fond{position:fixed;inset:0;z-index:0;background:var(--nuit) url(assets/fond_accueil_desk.jpg) center/cover no-repeat}
.fond::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,7,24,.15) 0%,rgba(7,7,24,.35) 55%,rgba(7,7,24,.85) 100%)}
@media (max-aspect-ratio:1/1){.fond{background-image:url(assets/fond_accueil_phone.jpg);background-position:center 30%}}
main{position:relative;z-index:1;padding-inline:16px}
.col{max-width:1080px;margin-inline:auto}
.barre{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 16px 0;max-width:1112px;margin-inline:auto}
.marque{display:flex;align-items:center;gap:10px;font:12px var(--titre);letter-spacing:.3em;color:var(--doux)}
.marque img{width:34px;height:34px;border-radius:8px}
.langues{display:flex;gap:4px;padding:3px;border:1px solid var(--verre-bord);border-radius:10px;background:rgba(10,14,36,.55)}
.langues button{font:12px var(--titre);letter-spacing:.12em;color:var(--doux);background:none;border:0;border-radius:7px;padding:7px 12px;cursor:pointer}
.langues button[aria-pressed="true"]{background:rgba(61,123,220,.35);color:#fff;box-shadow:inset 0 0 0 1px rgba(143,180,242,.5)}
button:focus-visible,a:focus-visible{outline:2px solid var(--bleu-clair);outline-offset:2px}
.ouverture{padding-block:12vh 14vh;text-align:center}
.ouverture h1{margin:0;font:400 clamp(54px,12vw,132px)/1 var(--titre);letter-spacing:.2em;padding-left:.2em;text-shadow:0 4px 40px rgba(0,0,0,.7)}
.accroche{margin:22px auto 0;max-width:30ch;font-size:clamp(19px,2.4vw,24px);font-weight:300;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.9)}
.actions{margin-top:34px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:10px;font:13px var(--titre);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:#fff;padding:16px 26px;border-radius:12px;border:1px solid rgba(143,180,242,.55);background:linear-gradient(180deg,#4a89ea,#2c5fb8);box-shadow:0 8px 30px rgba(20,50,120,.5)}
.btn.second{background:rgba(10,14,36,.6);border-color:var(--verre-bord);box-shadow:none}
.btn:hover{filter:brightness(1.12)}
.btn svg{width:18px;height:18px;flex:none}
.mention{margin-top:14px;font-size:14px;color:var(--doux)}
.bandeau{background:var(--verre);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--verre-bord);border-radius:20px;padding:clamp(22px,4vw,44px);margin-bottom:28px}
h2{margin:0 0 6px;font:400 clamp(17px,2.2vw,22px)/1.3 var(--titre);letter-spacing:.14em;text-transform:uppercase}
.sous{margin:0 0 24px;color:var(--doux);max-width:60ch}
.film{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000 url(assets/fond_accueil_desk.jpg) center/cover;display:grid;place-items:center;border:1px solid var(--verre-bord)}
.film::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
.film button{all:unset;position:relative;display:grid;place-items:center;gap:14px;text-align:center;color:var(--doux);font-size:15px;cursor:pointer}
.film button:disabled{cursor:default}
.film .rond{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:rgba(61,123,220,.85);box-shadow:0 0 0 8px rgba(61,123,220,.2)}
.film .rond svg{width:32px;height:32px;margin-left:5px;fill:#fff}
.film .duree{position:absolute;right:14px;bottom:12px;font:12px var(--titre);letter-spacing:.1em;color:var(--texte);background:rgba(0,0,0,.6);padding:4px 8px;border-radius:6px}
.film iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.defile{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-color:var(--bleu) transparent}
.defile figure{margin:0;flex:0 0 auto;width:min(230px,62vw);scroll-snap-align:start}
.defile img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--verre-bord);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.quatre{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px 32px}
.quatre div{min-width:0}
.quatre h3{margin:0 0 6px;font:400 15px var(--titre);letter-spacing:.12em;color:var(--soleil)}
.quatre p{margin:0}
.peuples{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.peuple{text-align:center;min-width:0}
.peuple img{width:96px;height:96px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.peuple h3{margin:10px 0 2px;font:400 13px var(--titre);letter-spacing:.12em}
.peuple p{margin:0;font-size:14px;color:var(--doux)}
@media (max-width:640px){.peuples{grid-template-columns:repeat(2,1fr)}}
.points{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 0;padding:0;list-style:none}
.points li{font-size:14px;padding:7px 14px;border-radius:999px;border:1px solid var(--verre-bord);background:rgba(61,123,220,.12)}
footer{position:relative;z-index:1;padding:10px 16px calc(40px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--doux);font-size:14px}
footer .liens{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;margin-bottom:12px}
footer a{color:var(--texte);text-decoration:none;border-bottom:1px solid rgba(143,180,242,.35)}
footer .testeurs{color:var(--doux);font-size:13px;border-bottom-style:dotted}
@media (prefers-reduced-motion:no-preference){.ouverture h1,.accroche,.actions{animation:monte .9s ease-out both}.accroche{animation-delay:.15s}.actions{animation-delay:.3s}}
@keyframes monte{from{opacity:.001;transform:translateY(14px)}}
</style>
</head>
<body>
<div class="fond" aria-hidden="true"></div>

<header class="barre">
  <div class="marque"><img src="accueil/icone.png" alt="">SOLAR-GAME.COM</div>
  <div class="langues" role="group" aria-label="Langue / Language">
    <button id="b-fr" data-l="fr" aria-pressed="true">FR</button>
    <button id="b-en" data-l="en" aria-pressed="false">EN</button>
  </div>
</header>

<main>
  <section class="ouverture col">
    <h1>SOLAR</h1>
    <p class="accroche" data-t="accroche"></p>
    <div class="actions">
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.solargame.solar" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 2.5v19c0 .4.4.6.7.4L21 12.4c.3-.2.3-.6 0-.8L4.7 2.1c-.3-.2-.7 0-.7.4z"/></svg>
        <span data-t="play"></span></a>
      <a class="btn second" href="#film"><span data-t="voirfilm"></span></a>
    </div>
    <p class="mention" data-t="mention"></p>
  </section>

  <div class="col">
    <section class="bandeau" id="film">
      <h2 data-t="h-film"></h2>
      <p class="sous" data-t="s-film"></p>
      <div class="film" id="film-cadre">
        <button id="film-lire" type="button">
          <span class="rond"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>
          <span id="film-txt"></span>
        </button>
        <span class="duree">4:45</span>
      </div>
    </section>

    <section class="bandeau">
      <h2 data-t="h-cap"></h2>
      <p class="sous" data-t="s-cap"></p>
      <div class="defile" id="captures"></div>
    </section>

    <section class="bandeau">
      <h2 data-t="h-4x"></h2>
      <p class="sous" data-t="s-4x"></p>
      <div class="quatre" id="quatre"></div>
    </section>

    <section class="bandeau">
      <h2 data-t="h-peuples"></h2>
      <p class="sous" data-t="s-peuples"></p>
      <div class="peuples" id="peuples"></div>
      <ul class="points" id="points"></ul>
    </section>
  </div>
</main>

<footer>
  <div class="liens">
    <a href="https://www.youtube.com/@solar-game" target="_blank" rel="noopener">YouTube</a>
    <a id="l-regles" href="regles.html" data-t="regles"></a>
    <a id="l-confid" href="confidentialite.html" data-t="confid"></a>
    <a href="mailto:contact@solar-game.com">contact@solar-game.com</a>
  </div>
  <div>© 2026 TitanCorp, Inc. · <a class="testeurs" href="play.html" data-t="testeurs"></a></div>
</footer>

<script>
/* Identifiants YouTube des films (à remplir quand Marc les a mis en ligne). */
var FILM = { fr: '', en: '' };

var T={
fr:{accroche:"Stratégie spatiale 4X au tour par tour dans notre propre système solaire.",
play:"Bêta sur Google Play",voirfilm:"Voir le film",mention:"Bêta gratuite · sans publicité · jouable hors ligne",
"h-film":"Le film","s-film":"L'histoire des quatre peuples, du Soleil jusqu'à la ceinture de Kuiper.",
"film-attente":"Le film arrive bientôt","film-voir":"Lancer le film",
"h-cap":"Dans le jeu","s-cap":"Captures de l'application Android.",
"h-4x":"Dix tours pour bâtir une civilisation","s-4x":"Chaque action compte : à chaque tour, vous n'en avez que quelques-unes, et chaque choix a un prix.",
"h-peuples":"Quatre peuples","s-peuples":"Vos adversaires ordinateur ont chacun un tempérament – Conquérant, Stratège, Opportuniste ou Bâtisseur – et jouent pour gagner.",
regles:"Règles du jeu",confid:"Confidentialité",testeurs:"Accès testeurs",
x:[["EXPLORER","Envoyez vos colons vers de nouveaux mondes et faites des découvertes en chemin."],
["S'ÉTENDRE","Fondez des colonies, reliez-les par des routes, développez-les jusqu'au niveau 3."],
["EXPLOITER","Équilibrez énergie, matériaux, science et moral, et recherchez trois rangs de technologies."],
["CONQUÉRIR","Pillez vos voisins, déclarez la guerre, prenez leurs colonies – ou emparez-vous d'une capitale rivale."]],
p:[["terriens","Terriens","La Terre"],["martiens","Martiens","Mars"],["jupiteriens","Jupitériens","Les lunes de Jupiter"],["ceinturiens","Ceinturiens","La ceinture d'astéroïdes"]],
pts:["Solo contre l'ordinateur, de 2 à 4 nations","Jouable entièrement hors ligne","Sans publicité","Tutoriel et règles complètes","En français et en anglais"]},
en:{accroche:"Turn-based 4X space strategy set in our own Solar System.",
play:"Beta on Google Play",voirfilm:"Watch the film",mention:"Free beta · no ads · plays offline",
"h-film":"The film","s-film":"The story of the four peoples, from the Sun to the Kuiper Belt.",
"film-attente":"The film is coming soon","film-voir":"Play the film",
"h-cap":"In the game","s-cap":"Screenshots of the Android app.",
"h-4x":"Ten turns to build a civilization","s-4x":"Every action counts: each turn you have only a few actions, and every choice is a trade-off.",
"h-peuples":"Four peoples","s-peuples":"Your computer opponents each have a temperament – Conqueror, Strategist, Opportunist or Builder – and play to win.",
regles:"Game rules",confid:"Privacy",testeurs:"Tester access",
x:[["EXPLORE","Send colonists to new worlds and make discoveries along the way."],
["EXPAND","Found colonies, connect them with routes, develop them up to level 3."],
["EXPLOIT","Balance energy, materials, science and morale, and research three tiers of technology."],
["EXTERMINATE","Raid your neighbours, declare war, capture their colonies – or take a rival capital."]],
p:[["terriens","Terrans","Earth"],["martiens","Martians","Mars"],["jupiteriens","Jovians","The moons of Jupiter"],["ceinturiens","Belters","The asteroid belt"]],
pts:["Solo against the computer, 2 to 4 nations","Plays fully offline","No ads","Tutorial and full rules","English and French"]}};

/* Langue : ?lang=xx, sinon celle choisie dans le jeu (sc_lang), sinon celle du navigateur. */
var L=(navigator.language||'en').toLowerCase().indexOf('fr')===0?'fr':'en';
try{var q=new URLSearchParams(location.search).get('lang');var m=localStorage.getItem('sc_lang');if(q==='fr'||q==='en')L=q;else if(m==='fr'||m==='en')L=m;}catch(e){}
function $(s){return document.querySelector(s);}
function rendre(){
  var t=T[L];document.documentElement.lang=L;
  [].forEach.call(document.querySelectorAll('[data-t]'),function(e){e.textContent=t[e.dataset.t];});
  [].forEach.call(document.querySelectorAll('.langues button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.l===L));});
  $('#l-regles').href=L==='en'?'regles.en.html':'regles.html';
  $('#l-confid').href=L==='en'?'confidentialite.en.html':'confidentialite.html';
  $('#captures').innerHTML=[1,2,3,4,5,6,7].map(function(i){return '<figure><img src="accueil/capture_'+L+'_'+i+'.jpg" width="540" height="1080" alt="" loading="lazy"></figure>';}).join('');
  $('#quatre').innerHTML=t.x.map(function(a){return '<div><h3>'+a[0]+'</h3><p>'+a[1]+'</p></div>';}).join('');
  $('#peuples').innerHTML=t.p.map(function(a){return '<div class="peuple"><img src="accueil/'+a[0]+'.png" width="96" height="96" alt=""><h3>'+a[1].toUpperCase()+'</h3><p>'+a[2]+'</p></div>';}).join('');
  $('#points').innerHTML=t.pts.map(function(p){return '<li>'+p+'</li>';}).join('');
  var b=$('#film-lire');
  if(b){var id=FILM[L]||FILM.fr||FILM.en;b.disabled=!id;$('#film-txt').textContent=id?t['film-voir']:t['film-attente'];}
}
[].forEach.call(document.querySelectorAll('.langues button'),function(b){b.onclick=function(){L=b.dataset.l;try{localStorage.setItem('sc_lang',L);}catch(e){}rendre();};});
$('#film-lire').onclick=function(){
  var id=FILM[L]||FILM.fr||FILM.en;if(!id)return;
  $('#film-cadre').innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0&hl='+L+'" title="SOLAR" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
};
rendre();
</script>
</body>
</html>
